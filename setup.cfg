[metadata]
name = vqe_h2
version = 1.0.0
description = VQE for H2 molecule using Qiskit Nature
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/your-username/vqe-h2
author = VQE H2 Contributors
license = MIT
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Chemistry
    Topic :: Scientific/Engineering :: Physics :: Quantum Computing

[options]
packages = find:
python_requires = >=3.10
install_requires =
    qiskit>=0.44.0
    qiskit-nature>=0.6.0
    qiskit-aer>=0.12.0
    numpy>=1.23.0
    matplotlib>=3.6.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0.0
    black>=23.0.0
    ruff>=0.1.0
    mypy>=1.0.0
    pre-commit>=3.0.0

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    venv,
    build,
    dist

[isort]
profile = black
line_length = 100
skip_gitignore = true

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
ignore_missing_imports = True

[coverage:run]
source = src
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
